<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Outfit Weather</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="favorite-modal" class="favorite-modal hidden" aria-live="polite">
      <div class="favorite-modal-card">
        <p class="label">Favorite city</p>
        <h2>Which city do you want to check first?</h2>
        <form id="favorite-form">
          <label class="sr-only" for="favorite-city-input">Favorite city</label>
          <input id="favorite-city-input" type="text" value="Detroit" placeholder="Enter your favorite city" />
          <div class="favorite-modal-actions">
            <button type="submit" class="primary-btn">Save city</button>
            <button type="button" id="favorite-cancel" class="secondary-btn">Use Detroit</button>
          </div>
        </form>
      </div>
    </div>

    <main class="app">
      <section class="weather-card">
        <header class="topbar">
          <div>
            <p class="label">Current weather</p>
            <h1 id="city-name">Detroit, MI</h1>
          </div>
          <div class="unit-toggle" aria-label="Temperature unit toggle">
            <button class="unit-btn active" data-unit="c">°C</button>
            <button class="unit-btn" data-unit="f">°F</button>
          </div>
        </header>

        <div class="search-box">
          <label class="sr-only" for="city-search">Search city</label>
          <input id="city-search" type="text" value="Detroit" placeholder="Enter city name" />
          <button id="search-btn" type="button">Search</button>
          <button id="favorite-btn" type="button" class="favorite-btn">Save Favorite</button>
        </div>

        <div class="temp-row">
          <div id="temperature" class="temperature">--°</div>
          <div class="condition-wrap">
            <div id="condition-icon" class="condition-icon" aria-hidden="true">☀️</div>
            <div id="condition" class="condition">Loading...</div>
          </div>
        </div>

        <div class="outfit-box">
          <p class="label">Outfit suggestion</p>
          <h2 id="outfit">Checking the forecast...</h2>
          <div id="outfit-gallery" class="outfit-gallery" aria-live="polite"></div>
        </div>

        <section class="forecast-panel" aria-labelledby="week-forecast-heading">
          <div class="section-header">
            <p class="label">This week</p>
            <h3 id="week-forecast-heading">Weather for the rest of the week</h3>
          </div>
          <div id="week-forecast" class="week-forecast" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
